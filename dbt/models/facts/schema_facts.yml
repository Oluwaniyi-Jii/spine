version: 2

models:
  - name: fact_edition
    description: "Heart of Shelf: grain is one row per published physical or digital edition"
    columns:
      - name: edition_key
        tests:
          - not_null
          - unique
      - name: work_key
        tests:
          - not_null

  - name: fact_text_statistics
    description: "Text & literary NLP analytics for Project Gutenberg digital texts"
    columns:
      - name: digital_text_key
        tests:
          - not_null
          - unique
      - name: work_key
        tests:
          - not_null
