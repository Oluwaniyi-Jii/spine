version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shelf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shelf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelf_password}
      POSTGRES_DB: ${POSTGRES_DB:-shelf_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shelf_user} -d ${POSTGRES_DB:-shelf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shelf_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@shelf.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
