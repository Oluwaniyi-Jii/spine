[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelf"
version = "0.1.0"
description = "Analytical data warehouse reconstructing book publishing history from public bibliographic datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "dbt-core>=1.7.0",
    "dbt-postgres>=1.7.0",
    "rapidfuzz>=3.6.0",
    "nltk>=3.8.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "flake8>=7.0.0",
    "sqlfluff>=2.3.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
